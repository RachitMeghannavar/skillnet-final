<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillNet — AI Chatbox</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">COLLABORATE&lt;=&gt;INNOVATE</div>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="startup.html">STARTUP</a>
      <a href="about.html">ABOUT</a>
      <a href="profile.html">PROFILE</a>
      <a href="suggestion.html">SUGGESTION</a>
      <a href="aibox.html" class="active">AIBOX</a>
      <a href="teams.html">TEAMS</a>
      <a href="hackathons.html">HACKATHONS</a>
    </div>
    <button class="btn-nav" onclick="handleNavAuth()">Sign Up</button>
  </nav>

  <!-- AIBOX CONTENT -->
  <div class="aibox-wrap">
    <div class="chat-card">

      <!-- Chat Header -->
      <div class="chat-header">
        <h2>AI Student Chatbox</h2>
        <p>Ask about hackathons, certifications, events, and career growth in tech.</p>
      </div>

      <!-- Messages -->
      <div class="chatbox" id="chatbox"></div>

      <!-- Input Row -->
      <div class="chat-input-row">
        <input
          type="text"
          id="chatInput"
          placeholder="Type your question and press Enter..."
          autocomplete="off"
        />
        <button class="btn btn-primary" id="sendBtn">Send</button>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/aibox.js"></script>
</body>
</html>
