<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillNet — Student Profile</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">COLLABORATE&lt;=&gt;INNOVATE</div>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="startup.html">STARTUP</a>
      <a href="about.html">ABOUT</a>
      <a href="profile.html" class="active">PROFILE</a>
      <a href="suggestion.html">SUGGESTION</a>
      <a href="aibox.html">AIBOX</a>
      <a href="teams.html">TEAMS</a>
      <a href="hackathons.html">HACKATHONS</a>
    </div>
    <button class="btn-nav" onclick="handleNavAuth()">Sign Up</button>
  </nav>

  <!-- PROFILE FORM -->
  <div class="profile-wrap">
    <div class="profile-header">
      <h2>Student Profile</h2>
      <p>Fill in your details so teammates can find you.</p>
    </div>

    <div class="card card-pad">

      <!-- Photo Upload -->
      <div class="form-group">
        <label>Profile Photo</label>
        <div class="photo-preview-wrap">
          <div class="photo-preview" id="photoPreviewContainer">
            <img
              id="photoPreviewImg"
              src=""
              alt="Profile Photo"
              style="width:100%;height:100%;object-fit:cover;display:none;border-radius:50%;"
            />
            <span id="photoPlaceholder">&#128100;</span>
          </div>
          <input
            type="file"
            id="profilePhoto"
            accept="image/*"
            onchange="previewPhoto(event)"
            style="flex:1;"
          />
        </div>
      </div>

      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" />
      </div>

      <!-- College -->
      <div class="form-group">
        <label for="college">College Name</label>
        <input type="text" id="college" placeholder="e.g. IIT Bombay" />
      </div>

      <!-- Academic Background -->
      <div class="form-group">
        <label for="background">Academic Background</label>
        <textarea
          id="background"
          rows="3"
          placeholder="Your branch, year, and area of study..."
        ></textarea>
      </div>

      <!-- Awards -->
      <div class="form-group">
        <label for="awards">Awards &amp; Achievements</label>
        <textarea
          id="awards"
          rows="3"
          placeholder="Hackathons won, certifications, notable projects..."
        ></textarea>
      </div>

      <!-- Skills -->
      <div class="form-group">
        <label for="skills">Skills &amp; Interests</label>
        <textarea
          id="skills"
          rows="3"
          placeholder="e.g. React, Python, Machine Learning, UI/UX (comma-separated for best display in Teams)"
        ></textarea>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="profileEmail">Email Address</label>
        <input type="email" id="profileEmail" placeholder="your@email.com" />
      </div>

      <button
        class="btn btn-primary btn-block"
        style="padding:13px;font-size:1rem;margin-top:8px;"
        onclick="saveProfile()"
      >
        Save Profile
      </button>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
