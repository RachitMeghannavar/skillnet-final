<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillNet — Startup Ideas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">COLLABORATE&lt;=&gt;INNOVATE</div>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="startup.html" class="active">STARTUP</a>
      <a href="about.html">ABOUT</a>
      <a href="profile.html">PROFILE</a>
      <a href="suggestion.html">SUGGESTION</a>
      <a href="aibox.html">AIBOX</a>
      <a href="teams.html">TEAMS</a>
      <a href="hackathons.html">HACKATHONS</a>
    </div>
    <button class="btn-nav" onclick="handleNavAuth()">Sign Up</button>
  </nav>

  <div class="startup-layout">

    <!-- LEFT: Submit form (sticky) -->
    <div class="startup-form-panel">
      <div class="card card-pad">
        <div class="startup-label">SKILL NET</div>
        <h2 style="font-size:1.45rem;font-weight:700;margin-bottom:6px;">Share Your Idea</h2>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:24px;line-height:1.6;">
          Got a startup concept? Submit it and find builders to join your team.
        </p>

        <form id="startupForm">
          <div class="form-group">
            <label for="startupIdea">Startup Name / Idea</label>
            <input
              type="text"
              id="startupIdea"
              placeholder="e.g. EduMatch — AI-powered study groups"
            />
          </div>
          <div class="form-group">
            <label for="startupBrief">Description</label>
            <textarea
              id="startupBrief"
              rows="5"
              placeholder="What problem does it solve? Who is it for? How does it work?"
            ></textarea>
          </div>
          <button
            type="submit"
            id="submitBtn"
            class="btn btn-primary btn-block"
            style="padding:12px;font-size:0.97rem;"
          >
            Submit Idea
          </button>
        </form>
      </div>
    </div>

    <!-- RIGHT: Browse startups -->
    <div>
      <div class="startup-browse-header">
        <div>
          <h2 class="section-title">Active Startups</h2>
          <p class="section-sub">Join a team or launch your own idea.</p>
        </div>
        <span class="startup-count-badge" id="startupCount">&nbsp;</span>
      </div>

      <div id="startupsContainer">
        <p class="loading-text">Loading startups...</p>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/startup.js"></script>
</body>
</html>
