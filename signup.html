<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillNet — Sign Up</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">COLLABORATE&lt;=&gt;INNOVATE</div>
    <div class="nav-links">
      <a href="index.html">HOME</a>
      <a href="startup.html">STARTUP</a>
      <a href="about.html">ABOUT</a>
      <a href="profile.html">PROFILE</a>
      <a href="suggestion.html">SUGGESTION</a>
      <a href="aibox.html">AIBOX</a>
      <a href="teams.html">TEAMS</a>
      <a href="hackathons.html">HACKATHONS</a>
    </div>
    <button class="btn-nav" onclick="handleNavAuth()">Sign Up</button>
  </nav>

  <!-- AUTH CARD -->
  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Sign Up</h2>
      <p class="auth-subtitle">Create your SkillNet account</p>

      <form id="signupForm" novalidate>

        <!-- First Name -->
        <div class="form-group">
          <label for="signupName">First Name</label>
          <div class="input-icon-wrap">
            <span class="input-icon">&#128100;</span>
            <input
              type="text"
              id="signupName"
              placeholder="Enter your first name"
              autocomplete="given-name"
            />
          </div>
          <div class="form-error" id="nameError">Please enter your name.</div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <div class="input-icon-wrap">
            <span class="input-icon">@</span>
            <input
              type="email"
              id="signupEmail"
              placeholder="Enter your email"
              autocomplete="email"
            />
          </div>
          <div class="form-error" id="emailError">Please enter a valid email.</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">&#128274;</span>
            <input
              type="password"
              id="signupPassword"
              placeholder="Create a password (min 6 chars)"
              autocomplete="new-password"
            />
          </div>
          <div class="form-error" id="passwordError">Password must be at least 6 characters.</div>
        </div>

        <div class="form-error" id="generalError" style="margin-bottom:12px;"></div>

        <button type="submit" class="btn btn-dark btn-block" style="font-size:1rem;padding:13px;">
          SIGN UP
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();

      var name     = document.getElementById("signupName").value.trim();
      var email    = document.getElementById("signupEmail").value.trim();
      var password = document.getElementById("signupPassword").value;

      document.querySelectorAll(".form-error").forEach(function (el) {
        el.classList.remove("visible");
      });

      var valid = true;
      if (!name)  { document.getElementById("nameError").classList.add("visible");     valid = false; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById("emailError").classList.add("visible");    valid = false; }
      if (password.length < 6) {
                    document.getElementById("passwordError").classList.add("visible"); valid = false; }
      if (!valid) return;

      var btn = e.target.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Creating account...";

      auth.createUserWithEmailAndPassword(email, password)
        .then(function (cred) {
          return db.collection("users").doc(cred.user.uid).set({
            name: name,
            email: email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
        .then(function () {
          window.location.href = "login.html";
        })
        .catch(function (err) {
          var genErr = document.getElementById("generalError");
          genErr.textContent = getFirebaseError(err.code);
          genErr.classList.add("visible");
          btn.disabled = false;
          btn.textContent = "SIGN UP";
        });
    });
  </script>
</body>
</html>
